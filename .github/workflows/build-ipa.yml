name: Build IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'Direct download link to a decrypted Threads IPA (leave empty to use the DECRYPTED_IPA_URL secret)'
        required: false
        default: ''
      variant:
        description: 'sideload = certificate signing (with Safari extension); noplugins = SideStore / AltStore free account'
        type: choice
        options:
          - both
          - sideload
          - noplugins
        default: both

permissions:
  contents: read

env:
  SDK_VERSION: '16.5'
  MIN_IOS: '15.0'

jobs:
  build-ipa:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check IPA link
        env:
          INPUT_URL: ${{ inputs.ipa_url }}
          SECRET_URL: ${{ secrets.DECRYPTED_IPA_URL }}
        run: |
          URL="${INPUT_URL:-$SECRET_URL}"
          echo "IPA_URL=$URL" >> "$GITHUB_ENV"
      - name: Download Threads IPA
        run: |
          python3 -m pip install --break-system-packages --upgrade gdown
          python3 -m gdown "https://drive.google.com/uc?id=1mQ_z_g5UNnjmADVAMDf8aEU-VgG1Xlgk" -O Threads.ipa
          ls -lh Threads.ipa
          file Threads.ipa
          unzip -t Threads.ipa
          if ! unzip -l Threads.ipa | grep -q 'Payload/.*\.app/Info.plist'; then
            echo "::error::The downloaded file is not an IPA. Make sure the link downloads the file directly instead of opening a web page."
            exit 1
          fi
          ls -lh Threads.ipa

      - name: Install Theos
        id: theos
        uses: ./.github/actions/setup-theos
        with:
          sdk-version: ${{ env.SDK_VERSION }}

      - name: Build ThreadsPulse and Safari extension
        run: |
          MAKE="gmake FINALPACKAGE=1 TARGET=iphone:clang:${SDK_VERSION}:${MIN_IOS}"
          $MAKE
          $MAKE -C OpenThreadsSafariExtension

      - name: Inject IPA
        id: inject
        env:
          VARIANT: ${{ inputs.variant }}
          TP_VERSION: ${{ steps.theos.outputs.version }}
        run: |
          set -e
          mkdir -p dist
          BUNDLE="layout/Library/Application Support/ThreadsPulse/ThreadsPulse.bundle"
          inject() {
            local name="$1"; shift
            python3 -I scripts/inject_ipa.py -i Threads.ipa \
              -d .theos/obj/ThreadsPulse.dylib -b "$BUNDLE" \
              -o "dist/$name.ipa" --github-output "$GITHUB_OUTPUT" "$@"
          }
          if [ "$VARIANT" = "both" ] || [ "$VARIANT" = "sideload" ]; then
            inject sideload --appex OpenThreadsSafariExtension/.theos/obj/OpenThreadsSafariExtension.appex
          fi
          if [ "$VARIANT" = "both" ] || [ "$VARIANT" = "noplugins" ]; then
            inject noplugins --no-plugins
          fi

      - name: Rename files
        env:
          TP_VERSION: ${{ steps.theos.outputs.version }}
          THREADS_VERSION: ${{ steps.inject.outputs.threads_version }}
        run: |
          cd dist
          for f in *.ipa; do
            mv "$f" "Threads_${THREADS_VERSION}_Pulse_${TP_VERSION}_${f%.ipa}.ipa"
          done
          rm -f ../Threads.ipa
          ls -la

      - name: Upload sideload variant
        if: inputs.variant != 'noplugins'
        uses: actions/upload-artifact@v4
        with:
          name: Threads_${{ steps.inject.outputs.threads_version }}_Pulse_${{ steps.theos.outputs.version }}_sideload
          path: dist/*_sideload.ipa
          retention-days: 3
          compression-level: 0

      - name: Upload noplugins variant
        if: inputs.variant != 'sideload'
        uses: actions/upload-artifact@v4
        with:
          name: Threads_${{ steps.inject.outputs.threads_version }}_Pulse_${{ steps.theos.outputs.version }}_noplugins
          path: dist/*_noplugins.ipa
          retention-days: 3
          compression-level: 0
