name: Build IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'Direct URL to decrypted Threads IPA (optional)'
        required: false
        default: ''
        type: string
      variant:
        description: 'IPA variant to build'
        required: true
        type: choice
        options:
          - noplugins
          - sideload
          - both
        default: noplugins

permissions:
  contents: read

env:
  SDK_VERSION: '16.5'
  MIN_IOS: '15.0'

jobs:
  build-ipa:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve IPA URL
        env:
          INPUT_URL: ${{ inputs.ipa_url }}
          SECRET_URL: ${{ secrets.DECRYPTED_IPA_URL }}
        run: |
          set -e
          DEFAULT_URL="https://drive.google.com/uc?id=1mQ_z_g5UNnjmADVAMDf8aEU-VgG1Xlgk"
          URL="${INPUT_URL:-${SECRET_URL:-$DEFAULT_URL}}"
          echo "IPA_URL=$URL" >> "$GITHUB_ENV"

      - name: Download Threads IPA
        run: |
          set -e

          python3 -m pip install --upgrade gdown

          if [[ "$IPA_URL" == *"drive.google.com"* ]] || \
             [[ "$IPA_URL" == *"drive.usercontent.google.com"* ]]; then
            echo "Downloading IPA from Google Drive..."
            gdown "$IPA_URL" -O Threads.ipa
          else
            echo "Downloading IPA from direct URL..."
            curl -fL --retry 3 \
              --connect-timeout 30 \
              -o Threads.ipa "$IPA_URL"
          fi

          echo "Checking downloaded file..."
          ls -lh Threads.ipa
          file Threads.ipa

          if ! unzip -tq Threads.ipa; then
            echo "::error::Downloaded file is not a valid IPA archive."
            exit 1
          fi

          if ! unzip -Z1 Threads.ipa | grep -Eq '^Payload/[^/]+\.app/Info\.plist$'; then
            echo "::error::IPA structure is invalid."
            exit 1
          fi

          echo "IPA download and validation completed."

      - name: Install Theos
        id: theos
        uses: ./.github/actions/setup-theos
        with:
          sdk-version: ${{ env.SDK_VERSION }}

      - name: Build ThreadsPulse and Safari extension
        run: |
          set -e
          MAKE="gmake FINALPACKAGE=1 TARGET=iphone:clang:${SDK_VERSION}:${MIN_IOS}"
          $MAKE
          $MAKE -C OpenThreadsSafariExtension

      - name: Inject IPA
        id: inject
        env:
          VARIANT: ${{ inputs.variant }}
          TP_VERSION: ${{ steps.theos.outputs.version }}
        run: |
          set -e

          mkdir -p dist

          BUNDLE="layout/Library/Application Support/ThreadsPulse/ThreadsPulse.bundle"

          inject() {
            local name="$1"
            shift

            python3 -I scripts/inject_ipa.py \
              -i Threads.ipa \
              -d .theos/obj/ThreadsPulse.dylib \
              -b "$BUNDLE" \
              -o "dist/$name.ipa" \
              --github-output "$GITHUB_OUTPUT" \
              "$@"
          }

          if [ "$VARIANT" = "both" ] || \
             [ "$VARIANT" = "sideload" ]; then
            inject sideload \
              --appex OpenThreadsSafariExtension/.theos/obj/OpenThreadsSafariExtension.appex
          fi

          if [ "$VARIANT" = "both" ] || \
             [ "$VARIANT" = "noplugins" ]; then
            inject noplugins --no-plugins
          fi

      - name: Rename files
        env:
          TP_VERSION: ${{ steps.theos.outputs.version }}
          THREADS_VERSION: ${{ steps.inject.outputs.threads_version }}
        run: |
          set -e
          cd dist

          for f in *.ipa; do
            mv "$f" \
              "Threads_${THREADS_VERSION}_Pulse_${TP_VERSION}_${f%.ipa}.ipa"
          done

          rm -f ../Threads.ipa
          ls -lah

      - name: Upload sideload variant
        if: inputs.variant != 'noplugins'
        uses: actions/upload-artifact@v4
        with:
          name: Threads_${{ steps.inject.outputs.threads_version }}_Pulse_${{ steps.theos.outputs.version }}_sideload
          path: dist/*_sideload.ipa
          retention-days: 3
          compression-level: 0

      - name: Upload noplugins variant
        if: inputs.variant != 'sideload'
        uses: actions/upload-artifact@v4
        with:
          name: Threads_${{ steps.inject.outputs.threads_version }}_Pulse_${{ steps.theos.outputs.version }}_noplugins
          path: dist/*_noplugins.ipa
          retention-days: 3
          compression-level: 0
